<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111226" />
    <meta
      name="description"
      content="A pixel-art platform game about finding the one true platform before sundown."
    />
    <title>1platforms — We’ll be down to one by Q3.</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="site-header">
        <div class="brand-mark" aria-hidden="true">1P</div>
        <div>
          <p class="eyebrow">We’ll be down to one by Q3.</p>
          <h1>1platforms</h1>
        </div>
      </header>

      <section class="game-frame" aria-label="1platforms game">
        <canvas
          id="game"
          width="480"
          height="320"
          tabindex="0"
          aria-label="Pixel-art platform game. Press Enter to start, use A and D or the left and right arrows to move, Space to jump, Down plus Space to drop to the previous platform, and H for the field guide. Decoy landings automatically start a keycap or arrow-sequence task."
        >
          Your browser does not support the canvas needed to play 1platforms.
        </canvas>
      </section>

      <footer class="page-footer">
        <span>NO BACKEND. NO SINGLE SIGN-ON FOR YOUR SINGLE SIGN-ON.</span>
        <span>BUILT ON THE PLATFORM THAT WAS ALREADY HERE.</span>
      </footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
